http_port 3128

acl allowed_dst dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

# HTTPS: tunnel (no TLS interception, no CA cert needed anywhere) but only
# to allow-listed hosts. This means client tools see normal, unmodified
# certs — nothing extra to trust.
http_access allow CONNECT allowed_dst SSL_ports
http_access deny CONNECT

# Plain HTTP, same allowlist.
http_access allow allowed_dst
http_access deny all

access_log /var/log/squid/access.log squid
cache deny all
